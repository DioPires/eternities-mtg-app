name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-runs the full set, including the two jobs that come off the push path below, against
  # whatever ref you pick. This is the hand-crank for the common gap named on `budget` below: a
  # tree on `main` that `budget` or `smoke` has not scored, because the merge landed before those
  # two jobs reported (DEC-881). The no-PR route is closed: `enforce_admins` has been on since
  # 2026-10-11 (DEC-966), so the required checks reject a direct push to `main`.
  workflow_dispatch:

concurrency:
  # A hand-cranked run gets a group of its own. It is started for the common gap, a tree on `main`
  # that `budget` or `smoke` has not scored, and sharing `CI-<ref>` with pushes means the next push
  # to `main` cancels it in exactly the case it exists for. `push` and `pull_request` keep the
  # group they had (DEC-881).
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  # PRD 8.1.2 / 8.1.3. Pinned, because PRD 7.7.3 says upgrades are deliberate.
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  PNPM_VERSION: '10.34.5'

jobs:
  pipeline:
    name: pipeline (ruff, basedpyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest
        run: uv run pytest

  web:
    name: web (type-check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: TypeScript (strict)
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Vitest
        run: pnpm test
      - name: vercel.json matches the single header definition
        run: node scripts/write-vercel-json.mjs --check
      - name: Build (fixture-scale)
        run: pnpm build
        env:
          ETERNITIES_DATASET: scale
      - name: The build injected the data directory hash (PRD 8.3)
        run: |
          grep -q '<meta name="eternities:data" content="/data/[0-9a-f]\{16\}/"' dist/index.html
          echo "data hash injected: $(grep -o 'content="/data/[0-9a-f]\{16\}/"' dist/index.html | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # The freeze point. Both languages re-check the same committed bytes; a one-sided contract
  # change fails here rather than at integration (implementation-plan.md §7 risk 2).
  contract:
    name: data contract (shared test vector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
        working-directory: pipeline
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Python re-encodes the vector byte for byte
        # `--no-cov`: the coverage floor in pyproject.toml applies to every pytest run and one test
        # file cannot reach it. The floor is enforced by the `pipeline` job's full-suite run.
        run: uv run pytest tests/test_test_vector.py -v --no-cov
        working-directory: pipeline
      - name: TypeScript decodes the same bytes
        run: pnpm exec vitest run test/test-vector.test.ts
        working-directory: web
      - name: The committed vector is what the encoder produces right now
        run: |
          uv run eternities test-vector --out "$RUNNER_TEMP/vector"
          diff -r "$RUNNER_TEMP/vector" ../contract/test-vectors/v3
        working-directory: pipeline
      - name: The committed fixtures are what the generator produces right now
        run: |
          uv run eternities fixtures all --out "$RUNNER_TEMP/data"
          for hash in $(ls "$RUNNER_TEMP/data"); do
            diff -r "$RUNNER_TEMP/data/$hash" "../web/public/data/$hash"
          done
        working-directory: pipeline

  # Not on the push-to-main path (DEC-881). `main` is a strict-mode protected branch, so a PR can
  # only merge while its head is up to date with `main` — which makes the tree this job measured on
  # `refs/pull/N/merge` the same tree the merge lands. Re-measuring it on the push is a second
  # reading of bytes that have not changed.
  #
  # Two gaps in that argument, and the common one is not the one it is tempting to name. This job
  # is not a required context, so nothing holds the merge button for it: across the September window
  # the three required checks finish at about t+91 s while this job reports at about t+152 s
  # (medians, n=173 PR runs), so every PR has about a minute in which a merge can land a tree this
  # job has not scored. The rare gap is a commit that reaches `main` with no PR at all —
  # `enforce_admins` has been on since 2026-10-11 (DEC-966), so the required checks reject a direct
  # push to `main` for administrators too, and that gap is closed. `workflow_dispatch` is the
  # hand-crank for the common gap.
  budget:
    name: payload budget (PRD 7.2 + amendment A1)
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name != 'push'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # Measures encoded transferred size, not disk size: a .bin may not be edge-compressed and
      # the check must see what the browser sees (implementation-plan.md §2 Phase 0).
      #
      # The three rows are independent readings of the same `dist/`, and each one is brotli -q11
      # over its own data directory — CPU, not I/O. Run one after another they measured 28 + 2 + 28
      # seconds (medians, n=242 jobs) inside a job whose median is 73 s: two billed minutes for 73
      # seconds of work. Run together on the runner's two cores the rows cost what the longest one
      # costs, which lands the job at about 43 s — 17 s inside the billed minute, p90 48 s. Replaying
      # every measured job on that basis puts 224 of 226 in the one-minute bucket (DEC-881). Nothing
      # about what is measured changes: same script, same arguments, same bytes. Each row's output is
      # held back and replayed in its own group so a failure still reads as that row's failure, and
      # the step exits non-zero if any row did.
      #
      # `production` is the binding row — the real dataset is what ships, and the fixtures only
      # approximate it. Its `--dataset` value is read out of datasets.json, and `set -e` below is
      # what makes a failed read fail the job: `check-budget.mjs` treats an empty `--dataset` as
      # "use the default dataset" and exits 0, so without errexit the binding row would go green
      # having measured something else.
      - name: fixture-scale, fixture-small and production
        run: |
          set -euo pipefail
          production=$(node -p "require('./datasets.json').production")
          node scripts/check-budget.mjs --dataset scale > "$RUNNER_TEMP/scale.log" 2>&1 &
          scale_pid=$!
          node scripts/check-budget.mjs --dataset small > "$RUNNER_TEMP/small.log" 2>&1 &
          small_pid=$!
          node scripts/check-budget.mjs --dataset "$production" > "$RUNNER_TEMP/production.log" 2>&1 &
          production_pid=$!
          status=0
          for row in "fixture-scale:$scale_pid:scale" "fixture-small:$small_pid:small" "production:$production_pid:production"; do
            name=${row%%:*}
            rest=${row#*:}
            pid=${rest%%:*}
            log=${rest#*:}
            wait "$pid" || status=1
            echo "::group::$name"
            cat "$RUNNER_TEMP/$log.log"
            echo "::endgroup::"
          done
          exit $status

  # PRD 8.9.2's route smoke, PRD 9.1.2's bench smoke and PRD 9.1.4's forced-degradation check, in a
  # real browser.
  #
  # Runs against the same `web-dist` artefact the budget job measures, rather than building again:
  # a smoke test of a different build than the one whose bytes were counted proves less than it
  # looks like it does.
  #
  # A cloud runner has no representative GPU, which PRD 9.1.2 says in as many words. Chromium is
  # launched onto SwiftShader deliberately (`playwright.config.ts`) so WebGL2 exists at all, and
  # nothing in `e2e/` asserts a frame budget. PRD 7.2's ceilings are enforced by `pnpm bench` on the
  # reference machine; `web/bench/baseline-2026-09-05.json` is that record.
  #
  # Not on the push-to-main path, for the reason spelled out on `budget` above: under strict mode
  # the `refs/pull/N/merge` tree this ran against is the tree that lands, and this is the most
  # expensive job in the workflow by a factor of two (DEC-881). A red is seen by the PR author, on
  # the PR — but this is not a required context and it is the slowest job here, so it does not hold
  # the merge button. The three required checks finish at about t+91 s and this job reports at about
  # t+336 s (medians, n=173 PR runs): about four minutes on every PR in which a merge can land a
  # tree this job has not scored. That window is the common gap named on `budget` above, and it is
  # the way an unscored tree reaches `main`. `enforce_admins` closed the direct push on 2026-10-11
  # (DEC-966).
  smoke:
    name: route + bench + quality smoke (PRD 8.9.2, 9.1.2, 9.1.4)
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name != 'push'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # `--with-deps` because a bare runner is missing the shared libraries Chromium links against.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke
        run: pnpm test:e2e
      # Only on failure: the trace and the screenshot are what make a headless WebGL failure
      # diagnosable at all, and uploading them on every green run is 100 MB of nothing.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Unity (PRD v4 8.8.5). Four jobs on the self-hosted runner on the reference machine, behind one
  # hosted job that decides whether this run has to score the Unity project at all.
  #
  # The four are meant to be required contexts, so their ids are the contexts: none of them carries
  # a `name:`, and renaming one silently un-requires it until branch protection is edited to match.
  #
  # `unity-compile` is on the self-hosted runner too, which is not what 8.8.5 asked for. It asked
  # for a hosted `dotnet build` with no Unity install. That needs reference assemblies for
  # UnityEngine, UnityEditor, the test framework and every package, and Unity publishes none of
  # them: nuget.org has no Unity 6 assemblies, HDRP, VFX Graph and the test framework at the pinned
  # versions ship only inside the editor install, and a checked-in reference set is Unity's own
  # binaries committed to a public repository (DEC-951).
  #
  # The runner is one machine with one runner on it, so these jobs run one at a time, in whatever
  # order they were queued, and a pull request that touches `unity/` or this file waits for a
  # machine that is asleep or logged out. There is no bypass and none should be added:
  # docs/ci-runner.md.
  # ---------------------------------------------------------------------------------------------

  # A job that is skipped by an `if:` reports success to branch protection, which is what lets the
  # four jobs below be required on every pull request while only running on the ones that touch
  # `unity/` or one of the files that decide what these jobs are and what they check out: this
  # workflow (a job whose definition changed and did not run is unverified), `.gitattributes` and
  # `.lfsconfig` (what Git LFS holds and where it fetches from; only these jobs check out with
  # LFS) and `.gitignore` (what `unity-compile`'s clean-tree check can see). The same rule is the
  # hazard: anything that skips them for the wrong reason is a bypass. So the output is read
  # fail-closed below (`!= 'false'`, not `== 'true'`): if this job fails or is never reached, the
  # Unity jobs run.
  #
  # Not on the push-to-main path, for the reason spelled out on `budget` above: under strict mode
  # the `refs/pull/N/merge` tree these ran against is the tree that lands. `workflow_dispatch`
  # always runs them; it is the hand-crank, and docs/ci-runner.md uses it to verify the runner.
  unity-changes:
    name: unity changes (path filter for the self-hosted jobs)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      unity: ${{ steps.detect.outputs.unity }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              unity=false
              ;;
            pull_request)
              # Both ends of a rename, so moving a file out of `unity/` counts as touching it.
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                --jq '.[] | .filename, (.previous_filename // empty)')
              # "No" takes two things. The list is complete: the endpoint stops listing at 3,000
              # files, and a list that long may be truncated. And a grep that ran found nothing,
              # which is exit 1 and no other. Any case counts: the reference machine's file system
              # folds it, so `Unity/` in a pull request is `unity/` in the checkout.
              unity=true
              if [ "$(wc -l <<< "$files")" -lt 3000 ]; then
                found=0
                grep -qiE '^(unity/|\.github/workflows/ci\.yml$|\.gitattributes$|\.gitignore$|\.lfsconfig$)' <<< "$files" || found=$?
                if [ "$found" -eq 1 ]; then
                  unity=false
                fi
              fi
              ;;
            *)
              unity=true
              ;;
          esac
          echo "unity=$unity" | tee -a "$GITHUB_OUTPUT"

  # Opens the project in the pinned editor and quits. That imports every asset and compiles every
  # assembly, tests and editor scripts included; a compiler error ends batchmode with a non-zero
  # exit. An import that only logged errors does not: a shader that fails to parse exits 0. So the
  # editor runs `ConsoleCheck` before it quits, which exits 1 if its Console holds an error. The
  # Console has every import error because the import is from cold (the checkout note below). Then
  # the tree has to be exactly as committed: an editor that had to write a .meta, or rewrite the
  # package lock or a settings file, was given a project that is not what the next clone will open.
  unity-compile:
    needs: unity-changes
    if: ${{ !cancelled() && needs.unity-changes.outputs.unity != 'false' }}
    runs-on: [self-hosted, macOS, reference-machine]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: unity-compile
    steps:
      # One workspace per job (PRD v4 8.8.6): `path` puts each job's clone, and so its `Library/`,
      # in a directory of its own under the runner's work directory. The checkout cleans ignored
      # files too, so `Library/` does not survive a run and every job imports from cold. That is
      # the choice with no stale state in it; keeping `Library/` is a decision for measured import
      # times, not a default (DEC-951).
      - uses: actions/checkout@v4
        with:
          path: unity-compile
          lfs: true
      - name: Import, compile, no console errors
        run: unity/Eternities/batchmode.sh -quit -executeMethod Eternities.EditorTools.ConsoleCheck.Run
      - name: The import left the tree as committed
        run: |
          changed=$(git status --porcelain -- unity)
          if [ -n "$changed" ]; then
            echo "::error::Opening the project changed or created files. Commit them (a missing .meta is the usual one)."
            echo "$changed"
            exit 1
          fi

  unity-editmode:
    needs: unity-changes
    if: ${{ !cancelled() && needs.unity-changes.outputs.unity != 'false' }}
    runs-on: [self-hosted, macOS, reference-machine]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: unity-editmode
    steps:
      - uses: actions/checkout@v4
        with:
          path: unity-editmode
          lfs: true
      # No `-quit`: with `-runTests` the editor exits by itself when the run ends, 0 only if every
      # test passed.
      - name: EditMode tests
        run: unity/Eternities/batchmode.sh -runTests -testPlatform EditMode -testResults "$RUNNER_TEMP/editmode.xml"
      # Exit 0 is also what a run that found no tests returns. A suite that is not discovered must
      # not read as a suite that passed. Counted in our namespace: the run includes a test that a
      # package brings (Addressables' `TestStub`), which passes whether or not ours were found.
      - name: At least one of our tests ran and passed
        run: |
          set -euo pipefail
          ours='//test-case[starts-with(@fullname, "Eternities.Tests.")]'
          passed=$(xmllint --xpath "count(${ours}[@result = 'Passed'])" "$RUNNER_TEMP/editmode.xml")
          total=$(xmllint --xpath "count($ours)" "$RUNNER_TEMP/editmode.xml")
          echo "EditMode: $passed of $total passed in Eternities.Tests"
          [ "$passed" -ge 1 ]
      # The NUnit XML is kept from every run, a failed one too, for as long as the bench JSON. The
      # log above names no test: this file is where a reviewer reads which tests ran, by name, and
      # how each one ended (DEC-976, N6).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-editmode-results
          path: ${{ runner.temp }}/editmode.xml
          retention-days: 90

  # With graphics (PRD v4 8.8.3): `batchmode.sh` never passes `-nographics`, and the runner is a
  # launchd agent in a GUI session so there is a window server to give the editor a device. The
  # suite's own first test asserts the device is not Null rather than taking that on trust.
  unity-playmode:
    needs: unity-changes
    if: ${{ !cancelled() && needs.unity-changes.outputs.unity != 'false' }}
    runs-on: [self-hosted, macOS, reference-machine]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: unity-playmode
    steps:
      - uses: actions/checkout@v4
        with:
          path: unity-playmode
          lfs: true
      - name: PlayMode tests
        run: unity/Eternities/batchmode.sh -runTests -testPlatform PlayMode -testResults "$RUNNER_TEMP/playmode.xml"
      - name: At least one of our tests ran and passed
        run: |
          set -euo pipefail
          ours='//test-case[starts-with(@fullname, "Eternities.Tests.")]'
          passed=$(xmllint --xpath "count(${ours}[@result = 'Passed'])" "$RUNNER_TEMP/playmode.xml")
          total=$(xmllint --xpath "count($ours)" "$RUNNER_TEMP/playmode.xml")
          echo "PlayMode: $passed of $total passed in Eternities.Tests"
          [ "$passed" -ge 1 ]
      # Kept from every run, as the EditMode results above.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-playmode-results
          path: ${{ runner.temp }}/playmode.xml
          retention-days: 90

  # Runs the batchmode bench runner and archives what it wrote. The runner is a stub until the
  # slice agrees the JSON schema (PRD v4 9.5), so this proves the plumbing, not a frame time.
  unity-bench-smoke:
    needs: unity-changes
    if: ${{ !cancelled() && needs.unity-changes.outputs.unity != 'false' }}
    runs-on: [self-hosted, macOS, reference-machine]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: unity-bench-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          path: unity-bench-smoke
          lfs: true
      # PRD v4 8.8.6: a bench that shares the GPU with another editor is not a figure for this
      # machine. `pgrep` sees every account's processes, so an editor the owner left open counts.
      # It waits for an editor or a built player to exit, looking every 15 s for up to 15 minutes:
      # a pointer-test run is under two minutes and a draw about four a run, and a run that waits
      # longer than that is better failed and rerun.
      - name: No other Unity process is running
        run: |
          for wait in $(seq 0 60); do
            editor=$(pgrep -lx Unity || true)
            player=$(pgrep -fl 'MacOS/[E]ternities' || true)
            seen=$(printf '%s\n' "$editor" "$player" | sed '/^$/d')
            if [ -z "$seen" ]; then
              exit 0
            fi
            if [ "$wait" -lt 60 ]; then
              echo "Wait $((wait + 1)) of 60, 15 s: $(paste -sd ';' - <<< "$seen")"
              sleep 15
            fi
          done
          echo "::error::Another Unity process is running on the reference machine. Close it and re-run this job."
          echo "$seen"
          exit 1
      # The editor host of the bench (unity/Eternities/README.md): play mode, off screen at the
      # reference display's native size. No `-quit`: the run ends the editor itself, with exit code 0
      # only if the path completed. Its figures prove the path runs; they fill no row of PRD v4 9.5.
      - name: Bench runner
        run: |
          unity/Eternities/batchmode.sh -executeMethod Eternities.EditorTools.Bench.Run \
            -bench warm -benchSize 3456x2234 -benchCommit "$(git rev-parse HEAD)" \
            -benchOut "$RUNNER_TEMP/bench.json" -benchCaptures "$RUNNER_TEMP/captures"
      - name: The result is JSON and the path completed
        run: |
          python3 -m json.tool "$RUNNER_TEMP/bench.json"
          python3 -c 'import json, sys; run = json.load(open(sys.argv[1]))["run"]; sys.exit(None if run["complete"] else "the path did not complete: %s" % run["failure"])' "$RUNNER_TEMP/bench.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unity-bench-smoke
          path: ${{ runner.temp }}/bench.json
          retention-days: 90
      # The slice's checkpoints (PRD v4 9.3), as the run saw them: how an engineer without the
      # editor open sees the work (DEC-953).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unity-bench-captures
          path: ${{ runner.temp }}/captures
          retention-days: 14
