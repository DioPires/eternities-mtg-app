# PRD 8.1.2. Install once with `uv run --directory pipeline pre-commit install`.
# The hooks are the fast half of CI; the slow half (basedpyright, the browser check) stays in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # The data directories and the test vector are generated bytes; never rewrite them. Nor the
        # three directories the Unity editor writes. It ends lines with whitespace and files
        # without a newline (most `.meta` files, every scene), and the `unity-compile` job fails
        # on a tree the editor would write differently. A kit's sources are in there too: an ASCII
        # FBX ends its lines with whitespace, and its checksum is pinned in the kit's
        # `sources.yaml` (DEC-952).
        exclude: '^(web/public/data/|contract/test-vectors/|unity/Eternities/(Assets|Packages|ProjectSettings)/)'
      - id: end-of-file-fixer
        exclude: '^(web/public/data/|contract/test-vectors/|unity/Eternities/(Assets|Packages|ProjectSettings)/)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        # A file tracked by Git LFS is skipped by this hook, so the binaries `.gitattributes` sends
        # to LFS under `unity/` never meet the cap. That is why the cap is not raised for them.
        args: ['--maxkb=3072']
        exclude: '^web/public/data/'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: '^pipeline/'
      - id: ruff-format
        files: '^pipeline/'

  - repo: local
    hooks:
      - id: web-typecheck
        name: web type-check (TypeScript strict)
        entry: bash -c 'cd web && pnpm typecheck'
        language: system
        files: '^web/.*\.(ts|tsx)$'
        pass_filenames: false
      # Review §6.4 T6: the hook ran the type-checker and neither of the two things that catch what
      # a type-checker cannot. Both are seconds, which is what makes them the fast half.
      - id: web-lint
        name: web lint (eslint)
        entry: bash -c 'cd web && pnpm lint'
        language: system
        files: '^web/.*\.(ts|tsx|mjs|js)$'
        pass_filenames: false
      - id: web-test
        name: web unit + component tests (vitest)
        entry: bash -c 'cd web && pnpm test'
        language: system
        files: '^web/(src|test)/.*\.(ts|tsx)$'
        pass_filenames: false
      - id: vercel-json
        name: vercel.json matches security-headers.mjs
        entry: bash -c 'cd web && node scripts/write-vercel-json.mjs --check'
        language: system
        files: '^web/(vercel\.json|security-headers\.mjs)$'
        pass_filenames: false
