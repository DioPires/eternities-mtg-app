# PRD 8.1.2. Install once with `uv run --directory pipeline pre-commit install`.
# The hooks are the fast half of CI; the slow half (basedpyright, the browser check) stays in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # The data directories and the test vector are generated bytes; never rewrite them.
        exclude: '^(web/public/data/|contract/test-vectors/)'
      - id: end-of-file-fixer
        exclude: '^(web/public/data/|contract/test-vectors/)'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=3072']
        exclude: '^web/public/data/'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: '^pipeline/'
      - id: ruff-format
        files: '^pipeline/'

  - repo: local
    hooks:
      - id: web-typecheck
        name: web type-check (TypeScript strict)
        entry: bash -c 'cd web && pnpm typecheck'
        language: system
        files: '^web/.*\.(ts|tsx)$'
        pass_filenames: false
      - id: vercel-json
        name: vercel.json matches security-headers.mjs
        entry: bash -c 'cd web && node scripts/write-vercel-json.mjs --check'
        language: system
        files: '^web/(vercel\.json|security-headers\.mjs)$'
        pass_filenames: false
