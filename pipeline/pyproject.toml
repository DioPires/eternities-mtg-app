[project]
name = "eternities-pipeline"
version = "0.1.0"
description = "Eternities data pipeline: Scryfall bulk data to the web app's artefacts"
requires-python = "==3.13.*"
# The contract modules stay import-free of anything but the standard library — `binary.py`,
# `encode.py` and `models.py` are the byte-level freeze and must not depend on a wheel. Pillow is
# reached only by `pipeline/swatches.py`, and lazily even there: `swatches.bin` (worlds spec §2.2)
# is a statistic of the card's *art*, and there is no JPEG decoder in the standard library.
#
# Pinned exactly, like every dev dependency below, because these pixels feed a content-hashed
# dataset name (PRD 4.9.1): the swatch cache stores the decoded 8-byte record, so two machines
# agree by construction once the cache is warm, and the pin is what makes them agree from cold.
dependencies = ["pillow==12.3.0"]

[project.scripts]
eternities = "eternities.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eternities"]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.4",
  "basedpyright==1.31.7",
  "pre-commit==4.4.0",
  "pytest-cov==7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",    # pycodestyle, pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # bugbear
  "SIM",            # simplify
  "RUF",            # ruff
  "ANN",            # annotations
  "PTH",            # use pathlib
  "C4", "PIE", "RET",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN202", "ANN001", "I001"]

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false

# Unit tests for a module's internal rules are what review finding D10 asked for, and reaching a
# module-private helper is how they do it. The alternative is exporting every helper so that a test
# may call it, which makes a module's public surface a function of its test suite. Scoped to
# `tests/` so `src/` keeps the rule.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is measured on every run rather than in a separate command, because a floor nobody
# invokes is a floor that rots (review finding D10 — the tree had no coverage measurement at all).
# 91% is what the suite reached the day the floor went in; it is a ratchet against regression, not
# a target. `--cov-fail-under` makes it a gate rather than a number in the output nobody reads.
#
# It applies to every pytest invocation, so running a *subset* fails the floor by construction —
# pass `--no-cov` for that (`uv run pytest tests/test_report.py --no-cov`). CI's contract job does.
addopts = "-q --cov=eternities --cov-report=term-missing:skip-covered --cov-fail-under=91"

[tool.coverage.run]
# `sysmon` is CPython 3.13's PEP 669 monitoring backend. Without it, tracing every line takes the
# suite from 27 s to 93 s — a 3.5x tax on the default dev loop is how always-on coverage gets
# turned off again. With it the cost is under a second.
core = "sysmon"
branch = false
source = ["src/eternities"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
