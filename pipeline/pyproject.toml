[project]
name = "eternities-pipeline"
version = "0.1.0"
description = "Eternities data pipeline: Scryfall bulk data to the web app's artefacts"
requires-python = "==3.13.*"
dependencies = []

[project.scripts]
eternities = "eternities.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eternities"]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.4",
  "basedpyright==1.31.7",
  "pre-commit==4.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",    # pycodestyle, pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # bugbear
  "SIM",            # simplify
  "RUF",            # ruff
  "ANN",            # annotations
  "PTH",            # use pathlib
  "C4", "PIE", "RET",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
